<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Update - UCLM CARES</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
    }
    .email-container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .status-card {
      background-color: #f8f9fa;
      border-left: 4px solid #1877f2;
      padding: 12px;
      margin: 16px 0;
    }
    .status-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .status-description {
      font-size: 14px;
      margin-bottom: 8px;
    }
    .reason-section {
      background-color: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
    }
    .reason-label {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .reason-text {
      font-style: italic;
      font-size: 14px;
      margin: 0;
    }
    .action-info {
      background-color: #e8f4fd;
      border: 1px solid #bedcf3;
      border-radius: 6px;
      padding: 12px;
      margin-top: 16px;
    }
    .action-title {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .footer {
      font-size: 12px;
      color: #65676b;
      margin-top: 24px;
    }
    a {
      color: #1877f2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <h1>{{title}}</h1>

    <p>{{description}}</p>

    <div class="status-card">
      <div class="status-title">{{status_title}}</div>
      <div class="status-description">{{status_description}}</div>

      {{#if reason}}
      <div class="reason-section">
        <div class="reason-label">Reason:</div>
        <div class="reason-text">"{{reason}}"</div>
      </div>
      {{/if}}
    </div>

    <div class="action-info">
      <div class="action-title">{{action_title}}</div>
      <div class="action-text">{{action_text}}</div>
    </div>

    <div class="footer">
      Need help? Contact us at <a href="mailto:{{email}}">{{email}}</a><br/>
      © 2025 UCLM CARES. All rights reserved.
    </div>
  </div>
</body>
</html>
