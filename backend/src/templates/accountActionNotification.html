<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Update - UCLM CARES</title>

  <style type="text/css">
    body, table, td, p, a, li, blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
    }
    body {
      margin: 0 !important;
      padding: 40px 20px !important;
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .email-container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .header {
      padding: 32px 32px 0;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .company-name {
      font-size: 21px;
      font-weight: 600;
      color: #1c1e21;
      margin: 0;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #1c1e21;
      margin: 0 0 16px;
      line-height: 1.2;
    }

    .content {
      padding: 0 32px 32px;
    }

    .description {
      font-size: 16px;
      color: #65676b;
      line-height: 1.5;
      margin: 0 0 24px;
      text-align: center;
    }

    .status-card {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin: 24px 0;
      border-left: 4px solid #1877f2;
    }

    .status-title {
      font-size: 18px;
      font-weight: 600;
      color: #1c1e21;
      margin: 0 0 12px;
    }

    .status-description {
      font-size: 14px;
      color: #65676b;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    .reason-section {
      background-color: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }

    .reason-label {
      font-size: 14px;
      font-weight: 600;
      color: #856404;
      margin: 0 0 8px;
    }

    .reason-text {
      font-size: 14px;
      color: #856404;
      line-height: 1.5;
      margin: 0;
      font-style: italic;
    }

    .action-info {
      background-color: #e8f4fd;
      border: 1px solid #bedcf3;
      border-radius: 8px;
      padding: 16px;
      margin: 24px 0;
    }

    .action-title {
      font-size: 14px;
      font-weight: 600;
      color: #1c1e21;
      margin: 0 0 8px;
    }

    .action-text {
      font-size: 14px;
      color: #65676b;
      margin: 0;
      line-height: 1.4;
    }

    .footer {
      background-color: #f7f8fa;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #e4e6ea;
    }

    .contact-info {
      font-size: 14px;
      color: #65676b;
      margin: 0 0 12px;
      line-height: 1.4;
    }

    .copyright {
      font-size: 14px;
      color: #65676b;
      margin: 0;
      opacity: 0.7;
    }

    @media only screen and (max-width: 600px) {
      body {
        padding: 20px 16px !important;
      }
      .email-container {
        border-radius: 8px;
      }
      .header, .content, .footer {
        padding-left: 24px !important;
        padding-right: 24px !important;
      }
      .title {
        font-size: 20px !important;
      }
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">
      <div class="logo-container">
        <h2 class="company-name">UCLM CARES</h2>
      </div>
      <h1 class="title">{{title}}</h1>
    </div>

    <div class="content">
      <p class="description">
        {{description}}
      </p>

      <div class="status-card">
        <div class="status-title">{{status_title}}</div>
        <div class="status-description">{{status_description}}</div>
        
        {{#if reason}}
        <div class="reason-section">
          <div class="reason-label">Reason:</div>
          <div class="reason-text">"{{reason}}"</div>
        </div>
        {{/if}}
      </div>

      <div class="action-info">
        <div class="action-title">{{action_title}}</div>
        <div class="action-text">{{action_text}}</div>
      </div>
    </div>

    <div class="footer">
      <p class="contact-info">
        Need help? Contact us at <a href="mailto:{{email}}" style="color:#1877f2;text-decoration:none;">{{email}}</a>
      </p>
      <p class="copyright">
        © 2025 UCLM CARES. All rights reserved.
      </p>
    </div>
  </div>
</body>
</html>
